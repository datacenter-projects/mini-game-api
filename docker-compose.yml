# dependency สำหรับ local dev และ integration test เท่านั้น
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: minigame
      POSTGRES_DB: minigame
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # object storage จำลองของไฟล์ asset (docs/modules/asset.md) — ตั้ง S3_ENDPOINT=http://localhost:9000 · S3_BUCKET=minigame-asset-local
  # S3_CDN_BASE_URL=http://localhost:9000/minigame-asset-local · AWS_ACCESS_KEY_ID=minigame · AWS_SECRET_ACCESS_KEY=minigame-secret
  # console: http://localhost:9001 · bucket สร้างให้โดย minio-init (อ่านได้โดยไม่ต้อง login เฉพาะเครื่อง local)
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minigame
      MINIO_ROOT_PASSWORD: minigame-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minigame minigame-secret &&
      mc mb --ignore-existing local/minigame-asset-local &&
      mc anonymous set download local/minigame-asset-local"

volumes:
  pgdata:
  miniodata:
