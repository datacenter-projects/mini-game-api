# dependency สำหรับ local dev และ integration test เท่านั้น
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: minigame
      POSTGRES_DB: minigame
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
