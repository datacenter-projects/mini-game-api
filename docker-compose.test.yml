# dependency สำหรับ integration test และ load test เท่านั้น (docs/TESTING.md)
# แยกจาก docker-compose.yml: port ไม่ชนของ dev (55432 / 56379) และเก็บข้อมูลใน RAM — down แล้วหายหมด
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: minigame
      POSTGRES_DB: minigame_test
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame -d minigame_test"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # object storage จำลองของไฟล์ asset (เก็บข้อมูลใน RAM) — ตั้ง S3_ENDPOINT=http://localhost:59000 · S3_BUCKET=minigame-asset-test
  # AWS_ACCESS_KEY_ID=minigame · AWS_SECRET_ACCESS_KEY=minigame-secret · integration test ของ asset ใช้ S3 จำลองในตัว (pkg/testutil.NewFakeS3)
  # จึงไม่บังคับต้องเปิดตัวนี้ — ใช้ลองอัปจริงกับ platform/storage หรือ scripts/seed_asset_global
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minigame
      MINIO_ROOT_PASSWORD: minigame-secret
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minigame minigame-secret &&
      mc mb --ignore-existing local/minigame-asset-test"
