# build + push image ขึ้น GHCR เมื่อ push tag — deploy ขึ้น k8s ทำนอก repo (ดู docs/DEPLOYMENT.md)
#   dev-*  ต้องอยู่บน origin/dev
#   prod-* ต้องอยู่บน origin/main
# เพิ่ม env ใหม่ (sit/uat/demo): เพิ่ม pattern ใน on.push.tags และ case ใน step "tag → branch"
name: release

on:
  push:
    tags:
      - "dev-[0-9]*"
      - "prod-[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/datacenter-projects/minigame-api

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ต้องมีประวัติของทุก branch ถึงจะเช็ค ancestor ได้

      - name: tag → branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            dev-*)  BRANCH=dev ;;
            prod-*) BRANCH=main ;;
            *) echo "::error::unknown tag prefix: $TAG"; exit 1 ;;
          esac
          SHA=$(git rev-parse HEAD)
          # ancestor test แทน `git branch -r --contains | grep` ที่ match แบบ substring
          if ! git merge-base --is-ancestor "$SHA" "origin/$BRANCH"; then
            echo "::error::tag $TAG ($SHA) is not on origin/$BRANCH"
            exit 1
          fi
          echo "tag $TAG ($SHA) is on origin/$BRANCH"

  check:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  image:
    needs: [verify-tag, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: image tags
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          {
            echo "sha=$SHA"
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            echo "$IMAGE:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
